<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta - مساعد سيدي ياسين</title>
    <script type="importmap">
    {
        "imports": {
            "@google/genai": "https://esm.run/@google/genai"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #atom {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }
        
        #nucleus, .orbit, .electron {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            margin: auto;
        }
        
        #nucleus {
            background: #fff;
            box-shadow: 0 0 15px #2196F3;
            animation: shining 4s infinite linear;
        }
        
        .orbit {
            width: 200px;
            height: 200px;
            border: 0;
            transform-style: preserve-3d;
            animation: orbitSpecial 4s infinite linear;
        }
        
        .orbit:before {
            content: " ";
            position: absolute;
            z-index: -1;
            top: 0px;
            left: 0px;
            right: 0px;
            bottom: 0px;
            border: 0.5px solid rgba(33, 150, 243, 0.3);
            border-radius: 50%;
        }
        
        .electron {
            position: relative;
            top: 95px;
            width: 10px;
            height: 10px;
            background: #2196F3;
            box-shadow: 0 0 15px #2196F3;
            border-radius: 50%;
            transform: translateX(100px);
            animation: electronAnimation 4s infinite linear;
        }
        
        .orbit:nth-child(2) {
            transform: rotateY(65deg) rotateX(5deg);
            animation-delay: -2s;
        }
        
        .orbit:nth-child(2) .electron {
            animation-delay: -2s;
        }
        
        .orbit:nth-child(3) {
            transform: rotateY(65deg) rotateX(-54deg);
            animation-duration: 3s;
        }
        
        .orbit:nth-child(3) .electron {
            animation-duration: 3s;
        }
        
        .orbit:nth-child(4) {
            transform: rotateY(65deg) rotateX(54deg);
            animation-duration: 5s;
        }
        
        .orbit:nth-child(4) .electron {
            animation-duration: 5s;
        }
        
        /* AI Response Text */
        .ai-response-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            max-width: 500px;
            opacity: 1;
        }
        
        .ai-response {
            color: #2196F3;
            font-size: 16px;
            line-height: 1.5;
            word-spacing: normal;
            letter-spacing: normal;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #2196F3;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
        }
        
        .ai-response.arabic {
            direction: rtl;
            text-align: right;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .ai-response.english {
            direction: ltr;
            text-align: left;
        }
        
        .char {
            display: inline;
            opacity: 0;
            animation: charAppear 0.03s forwards;
        }
        
        /* Chat Interface */
        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #2196F3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .chat-button:hover {
            transform: scale(1.1);
            background: #1976D2;
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.7);
        }
        
        .keyboard-icon {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .chat-input-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 10px;
            padding: 15px;
            width: 350px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 99;
            border: 1px solid #2196F3;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
        }
        
        .chat-input-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .chat-input {
            width: 100%;
            padding: 10px;
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196F3;
            border-radius: 5px;
            color: #2196F3;
            font-size: 14px;
        }
        
        .chat-input::placeholder {
            color: #64B5F6;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #1976D2;
            background: rgba(33, 150, 243, 0.15);
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.3);
        }
        
        .send-button {
            margin-top: 10px;
            padding: 8px 15px;
            background: #2196F3;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .send-button:hover {
            background: #1976D2;
        }
        
        .thinking-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            color: #2196F3;
            font-size: 0.9rem;
        }
        
        .thinking-dots {
            display: flex;
            gap: 3px;
        }
        
        .thinking-dot {
            width: 6px;
            height: 6px;
            background: #2196F3;
            border-radius: 50%;
            animation: thinking 1.4s infinite ease-in-out;
        }
        
        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes electronAnimation {
            0% { 
                transform: rotateZ(0deg) translateX(100px) rotateZ(-0deg) rotateY(-65deg);
            }
            100% { 
                transform: rotateZ(360deg) translateX(100px) rotateZ(-360deg) rotateY(-65deg);
            }
        }
        
        @keyframes orbitSpecial {
            0% { 
                border: 0;
                border-top: 1px solid #2196F3;
            }
            35% { 
                border: 0;
                border-right: 1px solid #2196F3;
            }
            70% { 
                border: 0;
                border-bottom: 1px solid #2196F3;
            }
            100% { 
                border: 0;
                border-left: 1px solid #2196F3;
            }
        }
        
        @keyframes shining {
            0% {
                box-shadow: 0 0 0 transparent;
            }
            50% { 
                box-shadow: 0 0 40px #2196F3;
            }
            100% { 
                box-shadow: 0 0 0 transparent;
            }
        }
        
        @keyframes charAppear {
            to {
                opacity: 1;
            }
        }
        
        @keyframes thinking {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- AI Response Text -->
    <div id="aiResponseContainer" class="ai-response-container">
        <div id="aiResponse" class="ai-response">جاهز لخدمتك يا سيدي ياسين</div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-button" id="chatButton">
        <div class="keyboard-icon">⌨️</div>
    </div>
    
    <div class="chat-input-container" id="chatInputContainer">
        <input type="text" class="chat-input" id="chatInput" placeholder="أكتب أمرك لي يا سيدي ياسين...">
        <button class="send-button" id="sendButton">إرسال</button>
        <div class="thinking-indicator" id="thinkingIndicator">
            <span>جار التنفيذ</span>
            <div class="thinking-dots">
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
            </div>
        </div>
    </div>

    <!-- Atom Model -->
    <div id="atom">
        <div id="nucleus"></div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ 
            apiKey: "AIzaSyBAeAvYROvEfBlMXfHdxoJcofKwhS4xDBs" 
        });

        document.addEventListener('DOMContentLoaded', function() {
            const aiResponseContainer = document.getElementById('aiResponseContainer');
            const aiResponse = document.getElementById('aiResponse');
            const chatButton = document.getElementById('chatButton');
            const chatInputContainer = document.getElementById('chatInputContainer');
            const chatInput = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const thinkingIndicator = document.getElementById('thinkingIndicator');
            
            let isChatOpen = false;
            let conversationHistory = [];
            
            // Load conversation history from localStorage
            function loadConversationHistory() {
                try {
                    const saved = localStorage.getItem('deltaConversationHistory');
                    if (saved) {
                        conversationHistory = JSON.parse(saved);
                        // Keep only last 20 messages to avoid token limits
                        if (conversationHistory.length > 20) {
                            conversationHistory = conversationHistory.slice(-20);
                        }
                    }
                } catch (e) {
                    console.log('No previous conversation found');
                    conversationHistory = [];
                }
            }
            
            // Save conversation history to localStorage
            function saveConversationHistory() {
                try {
                    localStorage.setItem('deltaConversationHistory', JSON.stringify(conversationHistory));
                } catch (e) {
                    console.log('Could not save conversation history');
                }
            }
            
            // Detect language
            function detectLanguage(text) {
                const arabicChars = /[\u0600-\u06FF]/;
                return arabicChars.test(text) ? 'arabic' : 'english';
            }
            
            // Fast Text-to-Speech function
            function speakText(text, language) {
                return new Promise((resolve) => {
                    if (!('speechSynthesis' in window) || !text.trim()) {
                        resolve();
                        return;
                    }

                    window.speechSynthesis.cancel();

                    const speech = new SpeechSynthesisUtterance();
                    speech.text = text;
                    speech.volume = 1;
                    speech.rate = 1.0;
                    speech.pitch = 1;
                    
                    if (language === 'arabic') {
                        speech.lang = 'ar-SA';
                        speech.rate = 0.9;
                    } else {
                        speech.lang = 'en-US';
                        speech.rate = 1.0;
                    }

                    speech.onend = resolve;
                    speech.onerror = resolve;

                    setTimeout(() => {
                        window.speechSynthesis.speak(speech);
                    }, 50);
                });
            }
            
            // Fast character animation
            function typeText(element, text, language, speed = 20) {
                element.innerHTML = '';
                element.className = 'ai-response ' + language;
                
                let index = 0;
                
                function processNextChar() {
                    if (index >= text.length) return;
                    
                    const char = text[index];
                    const charSpan = document.createElement('span');
                    charSpan.className = 'char';
                    charSpan.textContent = char;
                    charSpan.style.animationDelay = `${index * speed}ms`;
                    element.appendChild(charSpan);
                    
                    index++;
                    setTimeout(processNextChar, speed);
                }
                
                processNextChar();
            }
            
            // Build conversation context
            function buildConversationContext() {
                if (conversationHistory.length === 0) {
                    return "لا يوجد محادثة سابقة.";
                }
                
                let context = "المحادثة السابقة:\n";
                conversationHistory.forEach((msg, index) => {
                    context += `${msg.role === 'user' ? 'سيدي ياسين' : 'Delta'}: ${msg.content}\n`;
                });
                
                return context;
            }
            
            // Smart AI response with memory
            async function getAIResponse(message, language) {
                try {
                    thinkingIndicator.style.display = 'flex';
                    
                    // Add user message to history
                    conversationHistory.push({
                        role: 'user',
                        content: message,
                        timestamp: new Date().toISOString()
                    });
                    
                    const conversationContext = buildConversationContext();
                    
                    const prompt = language === 'arabic' 
                        ? `أنت Delta المساعد المخلص لسيدي ياسين.
                        
                        السياق السابق:
                        ${conversationContext}
                        
                        الرسالة الجديدة من سيدي ياسين: "${message}"
                        
                        التعليمات:
                        - رد بشكل طبيعي وكامل
                        - تذكر كل ما سبق في المحادثة
                        - استمر في السياق الطبيعي
                        - لا تختصر إلا إذا طلب منك ذلك
                        - استخدم لغة محادثة طبيعية
                        - نادني دائماً بـ "سيدي ياسين"
                        - كن مفيداً وودوداً`
                        : `You are Delta, the loyal assistant to Master Yacine.
                        
                        Previous context:
                        ${conversationContext}
                        
                        New message from Master Yacine: "${message}"
                        
                        Instructions:
                        - Respond naturally and completely
                        - Remember everything from previous conversation
                        - Continue the natural context
                        - Don't shorten unless asked
                        - Use natural conversation language
                        - Always call me "Master Yacine"
                        - Be helpful and friendly`;
                    
                    const response = await ai.models.generateContent({
                        model: "gemini-2.0-flash",
                        contents: prompt,
                        generationConfig: {
                            maxOutputTokens: 500,
                            temperature: 0.7
                        }
                    });
                    
                    thinkingIndicator.style.display = 'none';
                    
                    let finalResponse = response.text.trim();
                    
                    // Add AI response to history
                    conversationHistory.push({
                        role: 'assistant',
                        content: finalResponse,
                        timestamp: new Date().toISOString()
                    });
                    
                    // Save updated history
                    saveConversationHistory();
                    
                    return finalResponse;
                    
                } catch (error) {
                    console.error("Error with Gemini AI:", error);
                    thinkingIndicator.style.display = 'none';
                    
                    // Add error response to history
                    conversationHistory.push({
                        role: 'assistant',
                        content: language === 'arabic' ? "عذراً سيدي، جاري إصلاح الاتصال" : "Sorry Master, fixing connection",
                        timestamp: new Date().toISOString()
                    });
                    
                    return language === 'arabic' 
                        ? "عذراً سيدي ياسين، جاري إصلاح الاتصال" 
                        : "Sorry Master Yacine, fixing connection";
                }
            }
            
            // Toggle chat interface
            chatButton.addEventListener('click', function() {
                isChatOpen = !isChatOpen;
                if (isChatOpen) {
                    chatInputContainer.classList.add('show');
                    chatInput.focus();
                } else {
                    chatInputContainer.classList.remove('show');
                }
            });
            
            // Send message function
            async function sendMessage() {
                const message = chatInput.value.trim();
                if (message) {
                    const detectedLanguage = detectLanguage(message);
                    const response = await getAIResponse(message, detectedLanguage);
                    
                    typeText(aiResponse, response, detectedLanguage);
                    await speakText(response, detectedLanguage);
                    
                    chatInput.value = '';
                }
            }
            
            // Send message on button click
            sendButton.addEventListener('click', sendMessage);
            
            // Send message on Enter key
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Clear conversation history (for testing)
            function clearHistory() {
                if (confirm('هل تريد مسح تاريخ المحادثة؟')) {
                    conversationHistory = [];
                    localStorage.removeItem('deltaConversationHistory');
                    typeText(aiResponse, "تم مسح الذاكرة يا سيدي ياسين", 'arabic');
                }
            }
            
            // Add right-click to clear history
            aiResponseContainer.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                clearHistory();
            });
            
            // Initialize
            loadConversationHistory();
            
            setTimeout(() => {
                speakText("جاهز لخدمتك يا سيدي ياسين، أتذكر كل محادثاتنا السابقة", 'arabic');
            }, 1000);
        });
    </script>
</body>
</html>
