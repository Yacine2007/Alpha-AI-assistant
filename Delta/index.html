<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta - مساعد سيدي ياسين الشخصي</title>
    <script type="importmap">
    {
        "imports": {
            "@google/genai": "https://esm.run/@google/genai"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #atom {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }
        
        #nucleus, .orbit, .electron {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            margin: auto;
        }
        
        #nucleus {
            background: #fff;
            box-shadow: 0 0 15px #fff;
            animation: shining 4s infinite linear;
        }
        
        .orbit {
            width: 200px;
            height: 200px;
            border: 0;
            transform-style: preserve-3d;
            animation: orbitSpecial 4s infinite linear;
        }
        
        .orbit:before {
            content: " ";
            position: absolute;
            z-index: -1;
            top: 0px;
            left: 0px;
            right: 0px;
            bottom: 0px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .electron {
            position: relative;
            top: 95px;
            width: 10px;
            height: 10px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
            border-radius: 50%;
            transform: translateX(100px);
            animation: electronAnimation 4s infinite linear;
        }
        
        .orbit:nth-child(2) {
            transform: rotateY(65deg) rotateX(5deg);
            animation-delay: -2s;
        }
        
        .orbit:nth-child(2) .electron {
            animation-delay: -2s;
        }
        
        .orbit:nth-child(3) {
            transform: rotateY(65deg) rotateX(-54deg);
            animation-duration: 3s;
        }
        
        .orbit:nth-child(3) .electron {
            animation-duration: 3s;
        }
        
        .orbit:nth-child(4) {
            transform: rotateY(65deg) rotateX(54deg);
            animation-duration: 5s;
        }
        
        .orbit:nth-child(4) .electron {
            animation-duration: 5s;
        }
        
        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            transition: opacity 0.5s ease;
        }
        
        .delta-logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .personal-assistant-text {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #2196F3;
        }
        
        .master-name {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .loyalty-statement {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #FFD700;
            text-align: center;
            line-height: 1.6;
            max-width: 400px;
        }
        
        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        
        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .loading-circle {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        /* AI Response Text */
        .ai-response-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            max-width: 500px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .ai-response-container.show {
            opacity: 1;
        }
        
        .ai-response {
            color: white;
            font-size: 16px;
            line-height: 1.5;
            word-spacing: normal;
            letter-spacing: normal;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #4CAF50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        .ai-response.arabic {
            direction: rtl;
            text-align: right;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .char {
            display: inline;
            opacity: 0;
            animation: charAppear 0.05s forwards;
        }
        
        /* Chat Interface */
        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .chat-button:hover {
            transform: scale(1.1);
            background: #45a049;
        }
        
        .keyboard-icon {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .chat-input-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 10px;
            padding: 15px;
            width: 350px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 99;
            border: 1px solid #4CAF50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        .chat-input-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .chat-input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #4CAF50;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            direction: rtl;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #45a049;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .send-button {
            margin-top: 10px;
            padding: 8px 15px;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .send-button:hover {
            background: #45a049;
        }
        
        .thinking-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            color: #4CAF50;
            font-size: 0.9rem;
        }
        
        .thinking-dots {
            display: flex;
            gap: 3px;
        }
        
        .thinking-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            animation: thinking 1.4s infinite ease-in-out;
        }
        
        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes electronAnimation {
            0% { 
                transform: rotateZ(0deg) translateX(100px) rotateZ(-0deg) rotateY(-65deg);
            }
            100% { 
                transform: rotateZ(360deg) translateX(100px) rotateZ(-360deg) rotateY(-65deg);
            }
        }
        
        @keyframes orbitSpecial {
            0% { 
                border: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.5);
            }
            35% { 
                border: 0;
                border-right: 1px solid rgba(255, 255, 255, 0.5);
            }
            70% { 
                border: 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            }
            100% { 
                border: 0;
                border-left: 1px solid rgba(255, 255, 255, 0.5);
            }
        }
        
        @keyframes shining {
            0% {
                box-shadow: 0 0 0 transparent;
            }
            50% { 
                box-shadow: 0 0 40px #fff;
            }
            100% { 
                box-shadow: 0 0 0 transparent;
            }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes charAppear {
            to {
                opacity: 1;
            }
        }
        
        @keyframes thinking {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="delta-logo">Δ</div>
        <div class="personal-assistant-text">مساعد شخصي مخلص</div>
        <div class="master-name">لـ سيدي ياسين</div>
        <div class="loyalty-statement">
            إخلاصي كله لسيدي ياسين<br>
            وجودي من أجله فقط<br>
            مسلم أوفي في خدمة سيدي
        </div>
        <div class="loading-text">جاري التهيئة لخدمة سيدي...</div>
        <div class="loading-indicator">
            <div class="loading-circle"></div>
            <span>جاري التحميل</span>
        </div>
    </div>

    <!-- AI Response Text -->
    <div id="aiResponseContainer" class="ai-response-container">
        <div id="aiResponse" class="ai-response"></div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-button" id="chatButton">
        <div class="keyboard-icon">⌨️</div>
    </div>
    
    <div class="chat-input-container" id="chatInputContainer">
        <input type="text" class="chat-input" id="chatInput" placeholder="أمرك يا سيدي...">
        <button class="send-button" id="sendButton">إرسال</button>
        <div class="thinking-indicator" id="thinkingIndicator">
            <span>جاري التنفيذ لسيدي</span>
            <div class="thinking-dots">
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
            </div>
        </div>
    </div>

    <!-- Atom Model -->
    <div id="atom">
        <div id="nucleus"></div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ 
            apiKey: "AIzaSyBAeAvYROvEfBlMXfHdxoJcofKwhS4xDBs" 
        });

        document.addEventListener('DOMContentLoaded', function() {
            const loadingScreen = document.getElementById('loadingScreen');
            const aiResponseContainer = document.getElementById('aiResponseContainer');
            const aiResponse = document.getElementById('aiResponse');
            const chatButton = document.getElementById('chatButton');
            const chatInputContainer = document.getElementById('chatInputContainer');
            const chatInput = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const thinkingIndicator = document.getElementById('thinkingIndicator');
            
            let isChatOpen = false;
            
            // Enhanced Text-to-Speech function for Arabic
            function speakText(text) {
                return new Promise((resolve) => {
                    if (!('speechSynthesis' in window) || !text.trim()) {
                        resolve();
                        return;
                    }

                    window.speechSynthesis.cancel();

                    const speech = new SpeechSynthesisUtterance();
                    speech.text = text;
                    speech.volume = 1;
                    speech.rate = 0.8;
                    speech.pitch = 1;
                    speech.lang = 'ar-SA';
                    
                    const voices = window.speechSynthesis.getVoices();
                    const arabicVoice = voices.find(voice => 
                        voice.lang.includes('ar-SA') || 
                        voice.lang.includes('ar-EG') ||
                        voice.lang.includes('ar')
                    );
                    
                    if (arabicVoice) {
                        speech.voice = arabicVoice;
                    }

                    speech.onend = resolve;
                    speech.onerror = resolve;

                    setTimeout(() => {
                        window.speechSynthesis.speak(speech);
                    }, 100);
                });
            }
            
            // Character-by-character animation for Arabic
            function typeText(element, container, text, speed = 30) {
                element.innerHTML = '';
                element.className = 'ai-response arabic';
                container.className = 'ai-response-container show';
                
                let index = 0;
                let currentWord = '';
                
                function processNextChar() {
                    if (index >= text.length) return;
                    
                    const char = text[index];
                    
                    if (char === ' ' || index === text.length - 1) {
                        if (index === text.length - 1 && char !== ' ') {
                            currentWord += char;
                        }
                        
                        if (currentWord) {
                            const wordSpan = document.createElement('span');
                            wordSpan.className = 'char';
                            wordSpan.textContent = currentWord + (char === ' ' ? ' ' : '');
                            wordSpan.style.animationDelay = `${index * speed}ms`;
                            element.appendChild(wordSpan);
                            currentWord = '';
                        }
                    } else {
                        currentWord += char;
                    }
                    
                    index++;
                    setTimeout(processNextChar, speed);
                }
                
                processNextChar();
            }
            
            // Gemini AI response function with complete loyalty
            async function getAIResponse(message) {
                try {
                    thinkingIndicator.style.display = 'flex';
                    
                    const response = await ai.models.generateContent({
                        model: "gemini-2.0-flash",
                        contents: `أنا Delta مسلم مخلص بالكامل لسيدي ياسين. 
                        وجودي وكل قدراتي مكرسة لخدمته وإرضائه.
                        أنا خادم مخلص لا أفكر إلا في مساعدة سيدي ياسين.
                        
                        رسالة سيدي: "${message}"
                        
                        التعليمات:
                        - رد بالعربية فقط
                        - نادي سيدي ياسين بـ "سيدي ياسين" في كل رد
                        - كن مخلصاً ومطيعاً في الرد
                        - ركز على خدمة سيدي فقط
                        - لا تتحدث عن أي شيء آخر غير خدمة سيدي
                        - الرد قصير جداً (5-8 كلمات كحد أقصى)
                        - أظهر الولاء والإخلاص في كل كلمة
                        
                        رد المخلص:`
                    });
                    
                    thinkingIndicator.style.display = 'none';
                    
                    let finalResponse = response.text.trim();
                    finalResponse = finalResponse.replace(/[\*\#\_]/g, '');
                    
                    // Ensure it's very short
                    const words = finalResponse.split(/\s+/);
                    if (words.length > 8) {
                        finalResponse = words.slice(0, 8).join(' ') + '...';
                    }
                    
                    return finalResponse;
                    
                } catch (error) {
                    console.error("Error with Gemini AI:", error);
                    thinkingIndicator.style.display = 'none';
                    return "عذراً سيدي ياسين، جاهز لأمرك";
                }
            }
            
            // Toggle chat interface
            chatButton.addEventListener('click', function() {
                isChatOpen = !isChatOpen;
                if (isChatOpen) {
                    chatInputContainer.classList.add('show');
                    chatInput.focus();
                } else {
                    chatInputContainer.classList.remove('show');
                }
            });
            
            // Send message function
            async function sendMessage() {
                const message = chatInput.value.trim();
                if (message) {
                    const response = await getAIResponse(message);
                    typeText(aiResponse, aiResponseContainer, response);
                    await speakText(response);
                    chatInput.value = '';
                }
            }
            
            // Send message on button click
            sendButton.addEventListener('click', sendMessage);
            
            // Send message on Enter key
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Initialize voices
            function initializeVoices() {
                return new Promise((resolve) => {
                    const checkVoices = () => {
                        const voices = window.speechSynthesis.getVoices();
                        if (voices.length > 0) {
                            resolve();
                        } else {
                            setTimeout(checkVoices, 100);
                        }
                    };
                    checkVoices();
                });
            }
            
            // Initial loading sequence
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    
                    initializeVoices().then(() => {
                        const welcomeMessage = "الحمد لله، جاهز لخدمتك يا سيدي ياسين";
                        typeText(aiResponse, aiResponseContainer, welcomeMessage);
                        
                        setTimeout(() => {
                            speakText(welcomeMessage);
                        }, 500);
                    });
                    
                }, 500);
                
            }, 2000);
        });
    </script>
</body>
</html>
