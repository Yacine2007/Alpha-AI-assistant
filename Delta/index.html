<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta - مساعد سيدي ياسين</title>
    <script type="importmap">
    {
        "imports": {
            "@google/genai": "https://esm.run/@google/genai"
        }
    }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #atom {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }
        
        #nucleus, .orbit, .electron {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            margin: auto;
        }
        
        #nucleus {
            background: #fff;
            box-shadow: 0 0 15px #2196F3;
            animation: shining 4s infinite linear;
        }
        
        .orbit {
            width: 200px;
            height: 200px;
            border: 0;
            transform-style: preserve-3d;
            animation: orbitSpecial 4s infinite linear;
        }
        
        .orbit:before {
            content: " ";
            position: absolute;
            z-index: -1;
            top: 0px;
            left: 0px;
            right: 0px;
            bottom: 0px;
            border: 0.5px solid rgba(33, 150, 243, 0.3);
            border-radius: 50%;
        }
        
        .electron {
            position: relative;
            top: 95px;
            width: 10px;
            height: 10px;
            background: #2196F3;
            box-shadow: 0 0 15px #2196F3;
            border-radius: 50%;
            transform: translateX(100px);
            animation: electronAnimation 4s infinite linear;
        }
        
        .orbit:nth-child(2) {
            transform: rotateY(65deg) rotateX(5deg);
            animation-delay: -2s;
        }
        
        .orbit:nth-child(2) .electron {
            animation-delay: -2s;
        }
        
        .orbit:nth-child(3) {
            transform: rotateY(65deg) rotateX(-54deg);
            animation-duration: 3s;
        }
        
        .orbit:nth-child(3) .electron {
            animation-duration: 3s;
        }
        
        .orbit:nth-child(4) {
            transform: rotateY(65deg) rotateX(54deg);
            animation-duration: 5s;
        }
        
        .orbit:nth-child(4) .electron {
            animation-duration: 5s;
        }
        
        /* AI Response Text */
        .ai-response-container {
            position: fixed;
            bottom: 80px;
            left: 20px;
            max-width: 500px;
            opacity: 1;
            max-height: 120px;
            overflow: hidden;
        }
        
        .ai-response {
            color: white;
            font-size: 14px;
            line-height: 1.4;
            word-spacing: normal;
            letter-spacing: normal;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #2196F3;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
            white-space: pre-wrap;
            overflow: hidden;
        }
        
        .ai-response.arabic {
            direction: rtl;
            text-align: right;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .ai-response.english {
            direction: ltr;
            text-align: left;
        }
        
        .message-sender {
            color: #2196F3;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .code-block {
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196F3;
            border-radius: 5px;
            padding: 10px;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            position: relative;
        }
        
        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 3px 8px;
            font-size: 10px;
            cursor: pointer;
        }
        
        /* Chat Interface */
        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #2196F3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .chat-button:hover {
            transform: scale(1.1);
            background: #1976D2;
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.7);
        }
        
        .keyboard-icon {
            color: white;
            font-size: 20px;
        }
        
        .chat-input-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 10px;
            padding: 15px;
            width: 350px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 99;
            border: 1px solid #2196F3;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
        }
        
        .chat-input-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .chat-input-wrapper {
            position: relative;
        }
        
        .chat-input {
            width: 100%;
            padding: 10px 40px 10px 10px;
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196F3;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }
        
        .chat-input::placeholder {
            color: #64B5F6;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #1976D2;
            background: rgba(33, 150, 243, 0.15);
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.3);
        }
        
        .stop-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            display: none;
        }
        
        .send-button {
            margin-top: 10px;
            padding: 8px 15px;
            background: #2196F3;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }
        
        .send-button:hover {
            background: #1976D2;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .action-btn {
            flex: 1;
            padding: 6px 10px;
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            border-radius: 5px;
            color: #2196F3;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .action-btn:hover {
            background: rgba(33, 150, 243, 0.3);
        }
        
        .thinking-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            color: #2196F3;
            font-size: 0.9rem;
        }
        
        .thinking-dots {
            display: flex;
            gap: 3px;
        }
        
        .thinking-dot {
            width: 6px;
            height: 6px;
            background: #2196F3;
            border-radius: 50%;
            animation: thinking 1.4s infinite ease-in-out;
        }
        
        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        /* Full Chat Popup */
        .chat-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 80%;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #2196F3;
            border-radius: 15px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(33, 150, 243, 0.5);
        }
        
        .chat-popup.show {
            display: flex;
        }
        
        .popup-header {
            padding: 15px;
            border-bottom: 1px solid #2196F3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2196F3;
        }
        
        .close-popup {
            background: none;
            border: none;
            color: #2196F3;
            font-size: 20px;
            cursor: pointer;
        }
        
        .popup-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: white;
        }
        
        .popup-message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(33, 150, 243, 0.1);
        }
        
        .popup-sender {
            color: #2196F3;
            font-weight: bold;
            margin-bottom: 5px;
        }

        @keyframes electronAnimation {
            0% { 
                transform: rotateZ(0deg) translateX(100px) rotateZ(-0deg) rotateY(-65deg);
            }
            100% { 
                transform: rotateZ(360deg) translateX(100px) rotateZ(-360deg) rotateY(-65deg);
            }
        }
        
        @keyframes orbitSpecial {
            0% { 
                border: 0;
                border-top: 1px solid #2196F3;
            }
            35% { 
                border: 0;
                border-right: 1px solid #2196F3;
            }
            70% { 
                border: 0;
                border-bottom: 1px solid #2196F3;
            }
            100% { 
                border: 0;
                border-left: 1px solid #2196F3;
            }
        }
        
        @keyframes shining {
            0% {
                box-shadow: 0 0 0 transparent;
            }
            50% { 
                box-shadow: 0 0 40px #2196F3;
            }
            100% { 
                box-shadow: 0 0 0 transparent;
            }
        }
        
        @keyframes charAppear {
            to {
                opacity: 1;
            }
        }
        
        @keyframes thinking {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- AI Response Text -->
    <div id="aiResponseContainer" class="ai-response-container">
        <div id="aiResponse" class="ai-response"></div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-button" id="chatButton">
        <i class="keyboard-icon fas fa-keyboard"></i>
    </div>
    
    <div class="chat-input-container" id="chatInputContainer">
        <div class="chat-input-wrapper">
            <input type="text" class="chat-input" id="chatInput" placeholder="أكتب أمرك لي يا سيدي ياسين...">
            <button class="stop-button" id="stopButton">
                <i class="fas fa-square"></i>
            </button>
        </div>
        <button class="send-button" id="sendButton">إرسال</button>
        <div class="action-buttons">
            <button class="action-btn" id="expandButton">
                <i class="fas fa-chevron-up"></i> عرض كامل
            </button>
            <button class="action-btn" id="copyButton">
                <i class="fas fa-copy"></i> نسخ
            </button>
        </div>
        <div class="thinking-indicator" id="thinkingIndicator">
            <span>جار التنفيذ</span>
            <div class="thinking-dots">
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
            </div>
        </div>
    </div>

    <!-- Full Chat Popup -->
    <div class="chat-popup" id="chatPopup">
        <div class="popup-header">
            <h3>محادثة كاملة - Delta وسيدي ياسين</h3>
            <button class="close-popup" id="closePopup">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="popup-content" id="popupContent">
            <!-- Full conversation will be displayed here -->
        </div>
    </div>

    <!-- Atom Model -->
    <div id="atom">
        <div id="nucleus"></div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
        <div class="orbit">
            <div class="electron"></div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ 
            apiKey: "AIzaSyBAeAvYROvEfBlMXfHdxoJcofKwhS4xDBs" 
        });

        document.addEventListener('DOMContentLoaded', function() {
            const aiResponseContainer = document.getElementById('aiResponseContainer');
            const aiResponse = document.getElementById('aiResponse');
            const chatButton = document.getElementById('chatButton');
            const chatInputContainer = document.getElementById('chatInputContainer');
            const chatInput = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const stopButton = document.getElementById('stopButton');
            const thinkingIndicator = document.getElementById('thinkingIndicator');
            const expandButton = document.getElementById('expandButton');
            const copyButton = document.getElementById('copyButton');
            const chatPopup = document.getElementById('chatPopup');
            const popupContent = document.getElementById('popupContent');
            const closePopup = document.getElementById('closePopup');
            
            let isChatOpen = false;
            let conversationHistory = [];
            let isTyping = false;
            let currentTypingTimeout = null;
            
            // Load conversation history
            function loadConversationHistory() {
                try {
                    const saved = localStorage.getItem('deltaConversationHistory');
                    if (saved) {
                        conversationHistory = JSON.parse(saved);
                        if (conversationHistory.length > 20) {
                            conversationHistory = conversationHistory.slice(-20);
                        }
                    }
                } catch (e) {
                    conversationHistory = [];
                }
            }
            
            // Save conversation history
            function saveConversationHistory() {
                try {
                    localStorage.setItem('deltaConversationHistory', JSON.stringify(conversationHistory));
                } catch (e) {
                    console.log('Could not save conversation history');
                }
            }
            
            // Detect language
            function detectLanguage(text) {
                const arabicChars = /[\u0600-\u06FF]/;
                return arabicChars.test(text) ? 'arabic' : 'english';
            }
            
            // Format response with proper styling
            function formatResponse(text, sender) {
                const senderElement = `<div class="message-sender">${sender}</div>`;
                
                // Detect code blocks and format them
                let formattedText = text.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
                    return `\n<div class="code-block">${code.trim()}<button class="copy-btn" onclick="copyToClipboard(this)"><i class="fas fa-copy"></i></button></div>\n`;
                });
                
                // Format lists and line breaks
                formattedText = formattedText.replace(/\n/g, '<br>');
                formattedText = formattedText.replace(/\d+\.\s/g, '<br>$&');
                formattedText = formattedText.replace(/\-\s/g, '<br>• ');
                
                return senderElement + formattedText;
            }
            
            // Global function for copy buttons
            window.copyToClipboard = function(button) {
                const codeBlock = button.parentElement;
                const codeText = codeBlock.textContent.replace('Copy', '').trim();
                
                navigator.clipboard.writeText(codeText).then(() => {
                    const originalHtml = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => {
                        button.innerHTML = originalHtml;
                    }, 2000);
                });
            };
            
            // Fast character animation with line management
            function typeText(element, text, language, speed = 20) {
                if (currentTypingTimeout) {
                    clearTimeout(currentTypingTimeout);
                    isTyping = false;
                }
                
                element.innerHTML = '';
                element.className = 'ai-response ' + language;
                
                const formattedText = formatResponse(text, 'Delta');
                const lines = formattedText.split('<br>');
                let currentLines = [];
                let lineIndex = 0;
                isTyping = true;
                
                function processNextLine() {
                    if (!isTyping || lineIndex >= lines.length) {
                        isTyping = false;
                        return;
                    }
                    
                    currentLines.push(lines[lineIndex]);
                    
                    // Keep only last 3 lines
                    if (currentLines.length > 3) {
                        currentLines = currentLines.slice(-3);
                    }
                    
                    element.innerHTML = currentLines.join('<br>');
                    lineIndex++;
                    
                    currentTypingTimeout = setTimeout(processNextLine, speed * 10);
                }
                
                processNextLine();
            }
            
            // Stop typing function
            function stopTyping() {
                if (currentTypingTimeout) {
                    clearTimeout(currentTypingTimeout);
                    isTyping = false;
                }
                window.speechSynthesis.cancel();
                thinkingIndicator.style.display = 'none';
            }
            
            // Show/hide stop button based on typing
            function updateStopButton() {
                stopButton.style.display = isTyping ? 'block' : 'none';
            }
            
            // Build conversation context
            function buildConversationContext() {
                if (conversationHistory.length === 0) {
                    return "لا يوجد محادثة سابقة.";
                }
                
                let context = "المحادثة السابقة:\n";
                conversationHistory.forEach((msg, index) => {
                    context += `${msg.role === 'user' ? 'سيدي ياسين' : 'Delta'}: ${msg.content}\n`;
                });
                
                return context;
            }
            
            // Smart AI response with memory
            async function getAIResponse(message, language) {
                try {
                    thinkingIndicator.style.display = 'flex';
                    updateStopButton();
                    
                    // Add user message to history
                    conversationHistory.push({
                        role: 'user',
                        content: message,
                        timestamp: new Date().toISOString()
                    });
                    
                    const conversationContext = buildConversationContext();
                    
                    const prompt = language === 'arabic' 
                        ? `أنت Delta المساعد المخلص لسيدي ياسين.
                        
                        السياق السابق:
                        ${conversationContext}
                        
                        الرسالة الجديدة من سيدي ياسين: "${message}"
                        
                        التعليمات:
                        - رد بشكل طبيعي وكامل
                        - استخدم الترقيم والقوائم إذا كان ذلك مناسباً
                        - إذا كتبت كوداً برمجياً، ضعه بين علامات \`\`\`
                        - استخدم الأسطر الجديدة لتنظيم النص
                        - تذكر كل ما سبق في المحادثة
                        - استمر في السياق الطبيعي
                        - نادني دائماً بـ "سيدي ياسين"`
                        : `You are Delta, the loyal assistant to Master Yacine.
                        
                        Previous context:
                        ${conversationContext}
                        
                        New message from Master Yacine: "${message}"
                        
                        Instructions:
                        - Respond naturally and completely
                        - Use numbering and lists when appropriate
                        - If writing code, put it between \`\`\` marks
                        - Use new lines to organize text
                        - Remember everything from previous conversation
                        - Continue the natural context
                        - Always call me "Master Yacine"`;
                    
                    const response = await ai.models.generateContent({
                        model: "gemini-2.0-flash",
                        contents: prompt,
                        generationConfig: {
                            maxOutputTokens: 1000,
                            temperature: 0.7
                        }
                    });
                    
                    thinkingIndicator.style.display = 'none';
                    
                    let finalResponse = response.text.trim();
                    
                    // Add AI response to history
                    conversationHistory.push({
                        role: 'assistant',
                        content: finalResponse,
                        timestamp: new Date().toISOString()
                    });
                    
                    // Save updated history
                    saveConversationHistory();
                    
                    return finalResponse;
                    
                } catch (error) {
                    console.error("Error with Gemini AI:", error);
                    thinkingIndicator.style.display = 'none';
                    updateStopButton();
                    
                    conversationHistory.push({
                        role: 'assistant',
                        content: language === 'arabic' ? "عذراً سيدي، جاري إصلاح الاتصال" : "Sorry Master, fixing connection",
                        timestamp: new Date().toISOString()
                    });
                    
                    return language === 'arabic' 
                        ? "عذراً سيدي ياسين، جاري إصلاح الاتصال" 
                        : "Sorry Master Yacine, fixing connection";
                }
            }
            
            // Show full conversation in popup
            function showFullConversation() {
                popupContent.innerHTML = '';
                
                conversationHistory.forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'popup-message';
                    
                    const sender = msg.role === 'user' ? 'سيدي ياسين' : 'Delta';
                    messageDiv.innerHTML = formatResponse(msg.content, sender);
                    
                    popupContent.appendChild(messageDiv);
                });
                
                popupContent.scrollTop = popupContent.scrollHeight;
                chatPopup.classList.add('show');
            }
            
            // Copy current response to clipboard
            function copyCurrentResponse() {
                const lastResponse = conversationHistory[conversationHistory.length - 1];
                if (lastResponse && lastResponse.role === 'assistant') {
                    navigator.clipboard.writeText(lastResponse.content).then(() => {
                        // Visual feedback
                        const originalText = copyButton.innerHTML;
                        copyButton.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
                        setTimeout(() => {
                            copyButton.innerHTML = originalText;
                        }, 2000);
                    });
                }
            }
            
            // Event listeners
            chatButton.addEventListener('click', function() {
                isChatOpen = !isChatOpen;
                if (isChatOpen) {
                    chatInputContainer.classList.add('show');
                    chatInput.focus();
                } else {
                    chatInputContainer.classList.remove('show');
                }
            });
            
            stopButton.addEventListener('click', stopTyping);
            
            chatInput.addEventListener('input', updateStopButton);
            
            sendButton.addEventListener('click', async function() {
                const message = chatInput.value.trim();
                if (message) {
                    const detectedLanguage = detectLanguage(message);
                    const response = await getAIResponse(message, detectedLanguage);
                    
                    typeText(aiResponse, response, detectedLanguage);
                    updateStopButton();
                    chatInput.value = '';
                }
            });
            
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendButton.click();
                }
            });
            
            expandButton.addEventListener('click', showFullConversation);
            
            copyButton.addEventListener('click', copyCurrentResponse);
            
            closePopup.addEventListener('click', function() {
                chatPopup.classList.remove('show');
            });
            
            // Initialize
            loadConversationHistory();
            typeText(aiResponse, "جاهز لخدمتك يا سيدي ياسين", 'arabic');
            
            setTimeout(() => {
                // speakText("جاهز لخدمتك يا سيدي ياسين", 'arabic');
            }, 1000);
        });
    </script>
</body>
</html>
