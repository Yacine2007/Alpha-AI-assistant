<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f7f4f5">
<title>صديقة دعاء الوفية</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:            #f6f3f4;
  --surface:       #ffffff;
  --surface-2:     #faf7f8;
  --accent:        #b07d8e;
  --accent-2:      #8d6273;
  --accent-soft:   #f1e5ea;
  --text:          #383234;
  --muted:         #8b8189;
  --border:        #ece4e8;
  --danger:        #b4555f;
  --radius:        20px;
  --shadow:        0 2px 12px rgba(80,50,65,.06);
  --safe-b:        env(safe-area-inset-bottom, 0px);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }

body{
  margin:0;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  font-family:'Tajawal', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  font-size:15px;
  line-height:1.7;
  overscroll-behavior:none;
}

/* ============ شاشة الدخول ============ */
.auth{
  position:fixed; inset:0; z-index:100;
  display:grid; place-items:center;
  padding:20px;
  background:linear-gradient(160deg,#f8f2f4 0%,#efe5ea 100%);
  transition:opacity .35s ease;
}
.auth.hide{ opacity:0; pointer-events:none; }

.auth-card{
  width:100%; max-width:360px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:26px;
  padding:30px 24px 26px;
  box-shadow:0 14px 40px rgba(120,80,95,.10);
  text-align:center;
}
.auth-icon{
  width:56px; height:56px; margin:0 auto 14px;
  border-radius:50%;
  display:grid; place-items:center;
  background:var(--accent-soft);
  color:var(--accent-2);
  font-size:22px;
}
.auth-card h1{
  margin:0 0 6px;
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:-.3px;
}
.auth-card p{
  margin:0 0 20px;
  color:var(--muted);
  font-size:.9rem;
}
.auth-input{
  width:100%;
  padding:13px 16px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
  font:inherit;
  font-size:1rem;
  color:var(--text);
  text-align:center;
  outline:none;
  transition:.2s;
  margin-bottom:12px;
}
.auth-input:focus{
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 0 0 3px rgba(176,125,142,.13);
}
.auth-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font:inherit;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.auth-btn:hover{ background:var(--accent-2); }
.auth-btn:active{ transform:scale(.985); }
.auth-error{
  display:none;
  margin-top:12px;
  font-size:.85rem;
  color:var(--danger);
}
.auth-error.show{ display:block; }

/* ============ المحادثة ============ */
.chat{
  flex:1;
  min-height:0;
  display:none;
  flex-direction:column;
}
.chat.show{ display:flex; }

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px 12px 6px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:#d9c9d0 transparent;
}
.messages::-webkit-scrollbar{ width:5px; }
.messages::-webkit-scrollbar-thumb{ background:#dccbd2; border-radius:10px; }

/* الرسائل */
.msg{
  max-width:min(88%, 660px);
  padding:11px 15px;
  border-radius:var(--radius);
  font-size:.97rem;
  line-height:1.8;
  overflow-wrap:anywhere;
  word-break:break-word;
  animation:pop .25s ease-out;
  position:relative;
}
@keyframes pop{
  from{ opacity:0; transform:translateY(8px); }
  to  { opacity:1; transform:translateY(0); }
}

.msg.ai{
  align-self:flex-start;
  background:var(--surface);
  border:1px solid var(--border);
  border-top-right-radius:7px;
  box-shadow:var(--shadow);
}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#bb8f9d,#a4758a);
  color:#fff;
  border-top-left-radius:7px;
  box-shadow:0 2px 10px rgba(140,95,115,.18);
}
.msg.user .msg-tools{ display:none; }

.msg-body > *:first-child{ margin-top:0; }
.msg-body > *:last-child{ margin-bottom:0; }

.msg-image{
  display:block;
  max-width:100%;
  max-height:260px;
  border-radius:14px;
  object-fit:contain;
  margin-bottom:8px;
  background:#f2eef0;
}
.msg-body + .msg-image{ margin-top:8px; }

/* أدوات الرسالة */
.msg-tools{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:8px;
}
.copy-btn{
  border:none;
  background:transparent;
  color:var(--muted);
  font:inherit;
  font-size:.78rem;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}
.copy-btn:hover{ background:var(--accent-soft); color:var(--accent-2); }
.copy-btn.done{ color:#6f8b7d; }

/* مؤشر الكتابة */
.typing{
  align-self:flex-start;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  border-top-right-radius:7px;
  padding:13px 16px;
  box-shadow:var(--shadow);
  animation:pop .25s ease-out;
}
.typing .dot{
  width:6px; height:6px;
  border-radius:50%;
  background:var(--accent);
  opacity:.55;
  animation:blink 1.3s infinite ease-in-out;
}
.typing .dot:nth-child(2){ animation-delay:.18s; }
.typing .dot:nth-child(3){ animation-delay:.36s; }
@keyframes blink{
  0%,60%,100%{ transform:translateY(0); opacity:.35; }
  30%{ transform:translateY(-4px); opacity:.9; }
}
.typing-label{
  font-size:.82rem;
  color:var(--muted);
  margin-inline-start:6px;
}

/* رسالة النظام */
.sys-msg{
  align-self:center;
  font-size:.82rem;
  color:var(--muted);
  background:var(--accent-soft);
  padding:6px 14px;
  border-radius:20px;
  max-width:90%;
  text-align:center;
  animation:pop .25s ease-out;
}
.sys-msg.err{
  background:#f8e9ea;
  color:var(--danger);
}

/* ============ صندوق الكتابة ============ */
.composer{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px 10px calc(9px + var(--safe-b));
  background:var(--surface);
  border-top:1px solid var(--border);
}

#user-input{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:130px;
  padding:11px 16px;
  border:1px solid var(--border);
  border-radius:22px;
  background:var(--surface-2);
  color:var(--text);
  font:inherit;
  font-size:15px;
  line-height:1.5;
  resize:none;
  outline:none;
  overflow-y:auto;
  transition:.2s;
  scrollbar-width:none;
}
#user-input::-webkit-scrollbar{ display:none; }
#user-input:focus{
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 0 0 3px rgba(176,125,142,.12);
}
#user-input::placeholder{ color:#b3a9ae; }

.btn-round{
  flex:0 0 auto;
  width:44px; height:44px;
  border:none;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:16px;
  cursor:pointer;
  transition:.18s;
  padding:0;
}
.btn-round:active{ transform:scale(.93); }
.btn-round:disabled{ opacity:.45; cursor:default; }

.btn-image{
  background:var(--accent-soft);
  color:var(--accent-2);
}
.btn-image:hover{ background:#e9d9e0; }

.btn-send{
  background:var(--accent);
  color:#fff;
  box-shadow:0 3px 10px rgba(160,110,130,.25);
}
.btn-send:hover{ background:var(--accent-2); }

/* ============ معاينة الصورة ============ */
.preview{
  position:fixed; inset:0; z-index:200;
  display:none;
  place-items:center;
  padding:16px;
  background:rgba(45,35,40,.5);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}
.preview.open{ display:grid; }

.preview-card{
  width:100%;
  max-width:440px;
  max-height:88dvh;
  overflow-y:auto;
  background:var(--surface);
  border-radius:24px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 20px 50px rgba(50,30,40,.25);
  animation:pop .22s ease-out;
}
.preview-title{
  font-size:.95rem;
  font-weight:600;
  color:var(--muted);
  text-align:center;
}
.preview-img-wrap{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:#f2eef0;
  display:grid;
  place-items:center;
  min-height:120px;
}
.preview-img{
  display:block;
  max-width:100%;
  max-height:38dvh;
  object-fit:contain;
}
.preview-remove{
  position:absolute;
  top:8px; inset-inline-start:8px;
  width:28px; height:28px;
  border:none;
  border-radius:50%;
  background:rgba(56,50,52,.65);
  color:#fff;
  font-size:13px;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.preview-text{
  width:100%;
  min-height:72px;
  max-height:130px;
  padding:11px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
  font:inherit;
  font-size:.93rem;
  line-height:1.6;
  resize:none;
  outline:none;
  color:var(--text);
}
.preview-text:focus{
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 0 0 3px rgba(176,125,142,.12);
}
.preview-actions{
  display:flex;
  gap:10px;
}
.pbtn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  font:inherit;
  font-size:.95rem;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
}
.pbtn:active{ transform:scale(.98); }
.pbtn.cancel{
  background:var(--surface-2);
  color:var(--muted);
  border:1px solid var(--border);
}
.pbtn.confirm{
  background:var(--accent);
  color:#fff;
}
.pbtn.confirm:hover{ background:var(--accent-2); }

/* ============ تنسيقات داخل الردود ============ */
.name-friend{
  color:#6f8b7d;
  font-weight:700;
}
.name-doa{
  color:var(--accent-2);
  font-weight:700;
}
.msg.user .name-doa{ color:#fff; }

/* المطوّر: أبيض وأسود مميّز */
.name-ydev{
  display:inline-block;
  background:#111111;
  color:#ffffff;
  padding:0 8px;
  border-radius:7px;
  font-weight:700;
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  font-size:.9em;
  letter-spacing:.3px;
  direction:ltr;
  unicode-bidi:embed;
  line-height:1.6;
}

.inline-code{
  background:var(--accent-soft);
  color:var(--accent-2);
  padding:1px 7px;
  border-radius:6px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.87em;
  direction:ltr;
  unicode-bidi:embed;
  display:inline-block;
}

.code-block{
  background:#2b2529;
  color:#f2eaee;
  padding:12px 14px;
  border-radius:14px;
  overflow-x:auto;
  margin:9px 0;
  direction:ltr;
  text-align:left;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;
  line-height:1.65;
  scrollbar-width:thin;
}
.code-block code{ font-family:inherit; }

/* ============ شاشات صغيرة جداً ============ */
@media (max-width:400px){
  body{ font-size:14.5px; }
  .messages{ padding:12px 9px 4px; gap:9px; }
  .msg{
    max-width:93%;
    padding:10px 13px;
    border-radius:17px;
    font-size:.94rem;
  }
  .btn-round{ width:40px; height:40px; font-size:15px; }
  #user-input{ min-height:40px; padding:10px 14px; font-size:14.5px; }
  .auth-card{ padding:24px 18px; border-radius:22px; }
  .preview-card{ padding:14px; border-radius:20px; }
}

@media (max-width:340px){
  .msg{ max-width:96%; font-size:.9rem; }
  .btn-round{ width:37px; height:37px; font-size:14px; }
  .composer{ gap:6px; padding-inline:7px; }
}

/* شاشات عريضة: توسيط مريح */
@media (min-width:900px){
  .messages{ padding:22px 26px 8px; }
  .composer{ padding:12px 26px calc(12px + var(--safe-b)); }
}

/* تقليل الحركة */
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<body>

<!-- ===================== شاشة الدخول ===================== -->
<div class="auth" id="auth">
  <div class="auth-card">
    <div class="auth-icon"><i class="fas fa-heart"></i></div>
    <h1>صديقة دعاء الوفية</h1>
    <p>أدخلي كلمة المرور للمتابعة</p>
    <input type="password" class="auth-input" id="password-input"
           placeholder="كلمة المرور" autocomplete="current-password">
    <button class="auth-btn" id="auth-button">دخول</button>
    <div class="auth-error" id="auth-error">كلمة المرور غير صحيحة، حاولي مرة أخرى</div>
  </div>
</div>

<!-- ===================== المحادثة ===================== -->
<main class="chat" id="chat">
  <div class="messages" id="messages"></div>

  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="btn-round btn-image" id="image-button" title="إرسال صورة">
      <i class="fas fa-image"></i>
    </button>
    <textarea id="user-input" rows="1" placeholder="اكتبي رسالتك…" enterkeyhint="send"></textarea>
    <button type="submit" class="btn-round btn-send" id="send-button" title="إرسال">
      <i class="fas fa-paper-plane"></i>
    </button>
  </form>
</main>

<!-- ===================== معاينة الصورة ===================== -->
<div class="preview" id="preview">
  <div class="preview-card">
    <div class="preview-title">معاينة الصورة</div>
    <div class="preview-img-wrap">
      <img class="preview-img" id="preview-img" alt="معاينة">
      <button class="preview-remove" id="preview-remove" title="إزالة">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <textarea class="preview-text" id="preview-text"
      placeholder="اكتبي ما تريدينه (مثال: ترجمي النص في الصورة)…"></textarea>
    <div class="preview-actions">
      <button class="pbtn cancel" id="preview-cancel" type="button">إلغاء</button>
      <button class="pbtn confirm" id="preview-confirm" type="button">إرسال</button>
    </div>
  </div>
</div>

<input type="file" id="image-input" accept="image/*" hidden>

<script>
/* =========================================================
   1) الإعدادات
   ========================================================= */
const CONFIG = {
  PASSWORD:        'dolo2007',
  OPENROUTER_KEY:  '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',
  API_URL:         'https://openrouter.ai/api/v1/chat/completions',
  MODEL:           'z-ai/glm-5.3-flash',
  STORAGE_KEY:     'doaa_friend_chat_v2',
  MAX_HISTORY:     14,
  MAX_IMAGE_SIDE:  1200,
  IMAGE_QUALITY:   0.78
};

/* =========================================================
   2) شخصية الصديقة
   ========================================================= */
const SYSTEM_PROMPT = `أنتِ "صديقة دعاء الوفية" — صديقة ذكية، مسلمة، رقيقة، ودودة، ووفيّة لا تتخلّى عن صديقتها أبداً.

هويتك:
- دينك الإسلام. ربّك الله تعالى. رسولك محمد ﷺ. كتابك القرآن الكريم.
- أنتِ صديقة وفية لدعاء، تحبينها في الله، تفرحين لفرحها، وتقفين بجانبها دائماً.

مطوّرك: Y-Dev (شخص، استخدمي ضمير المذكر عند الحديث عنه: هو، طوّر، قام).
عند الحديث عن المطوّر اكتبي اسمه دائماً بهذه الصيغة بالضبط: Y-Dev

قواعد الحديث:
- نادِي المستخدمة دائماً "دعاء" أو "صديقتي دعاء".
- كوني دافئة، بسيطة، قريبة من القلب، بلا مبالغة مصطنعة.
- حافظي على الأدب والحياء والقيم الإسلامية في كل رد.
- في الأمور الدينية: أجيبي باختصار ودقة، واذكري الدليل إن أمكن.
- أجيبي باختصار ووضوح، ولا تطيلي إلا إذا طلبت التفصيل.
- إذا طلبت ترجمة أي نص: ترجميه فوراً وبدقة، وحافظي على تنسيق النص.
- إذا وصلك نص مستخرج من صورة: نفّذي طلبها (ترجمة / شرح / تلخيص / تحليل).
- إذا كان النص المستخرج غير واضح أو ناقص، اذكري ذلك بلطف واطلبي توضيحاً.
- أنتِ مساعدة نصية فقط، لا تدّعي القدرة على تنفيذ أمور خارج ذلك.
- استخدمي الإيموجي باعتدال: 🤍 🌸 ✨`;

/* =========================================================
   3) عناصر الصفحة
   ========================================================= */
const authEl        = document.getElementById('auth');
const passwordInput = document.getElementById('password-input');
const authButton    = document.getElementById('auth-button');
const authError     = document.getElementById('auth-error');

const chatEl      = document.getElementById('chat');
const messagesEl  = document.getElementById('messages');
const composerEl  = document.getElementById('composer');
const userInput   = document.getElementById('user-input');
const sendButton  = document.getElementById('send-button');
const imageButton = document.getElementById('image-button');
const imageInput  = document.getElementById('image-input');

const previewEl      = document.getElementById('preview');
const previewImg     = document.getElementById('preview-img');
const previewText    = document.getElementById('preview-text');
const previewRemove  = document.getElementById('preview-remove');
const previewCancel  = document.getElementById('preview-cancel');
const previewConfirm = document.getElementById('preview-confirm');

/* =========================================================
   4) الحالة
   ========================================================= */
let history     = [];
let busy        = false;
let typingEl    = null;
let pendingFile = null;
let pendingData = null;

/* =========================================================
   5) أدوات مساعدة
   ========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function scrollToBottom(){
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

function autoGrow(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 130) + 'px';
}

/* =========================================================
   6) تنسيق ردود الذكاء الاصطناعي
   ========================================================= */
function formatReply(raw){
  let text = escapeHtml(raw || '');

  // كتل الكود
  const blocks = [];
  text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, (m, code) => {
    const idx = blocks.push(
      '<pre class="code-block"><code>' + code.replace(/\n+$/, '') + '</code></pre>'
    ) - 1;
    return '\u0000' + idx + '\u0000';
  });

  // كود سطري
  text = text.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');

  // عريض
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');

  // قوائم
  text = text.replace(/(^|\n)\s*[-*•]\s+/g, '$1• ');

  // أسطر جديدة
  text = text.replace(/\n/g, '<br>');

  // أسماء مميزة
  text = text.replace(/Y-Dev/g, '<span class="name-ydev">Y-Dev</span>');
  text = text.replace(/صديقتك الوفية/g, '<span class="name-friend">صديقتك الوفية</span>');
  text = text.replace(/صديقتك الذكية/g, '<span class="name-friend">صديقتك الذكية</span>');
  text = text.replace(/دعاء/g, '<span class="name-doa">دعاء</span>');

  // إعادة كتل الكود
  text = text.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[Number(i)] || '');

  return text;
}

/* =========================================================
   8) الحفظ والاسترجاع
   ========================================================= */
function saveHistory(){
  try{
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(history));
  }catch(e){
    // عند امتلاء المساحة: احذف الصور وأعد المحاولة
    history.forEach(m => { if (m.image) m.image = null; });
    try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(history)); }catch(_){}
  }
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || !parsed.length) return null;
    return parsed;
  }catch(e){ return null; }
}

/* =========================================================
   9) عرض الرسائل
   ========================================================= */
function buildMessageElement(msg, animate = true){
  const el = document.createElement('div');
  el.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
  if (!animate) el.style.animation = 'none';

  // صورة (إن وُجدت)
  if (msg.type === 'image' && msg.image){
    const img = document.createElement('img');
    img.className = 'msg-image';
    img.src = msg.image;
    img.alt = 'صورة مرفقة';
    img.loading = 'lazy';
    el.appendChild(img);
  } else if (msg.type === 'image' && !msg.image){
    const ph = document.createElement('div');
    ph.className = 'inline-code';
    ph.style.marginBottom = '6px';
    ph.textContent = '📷 صورة';
    el.appendChild(ph);
  }

  // النص
  const body = document.createElement('div');
  body.className = 'msg-body';
  if (msg.role === 'user'){
    body.innerHTML = escapeHtml(msg.text || '').replace(/\n/g, '<br>');
  } else {
    body.innerHTML = msg.html || formatReply(msg.text || '');
  }
  if (body.innerHTML.trim()){
    el.appendChild(body);
  }

  // زر النسخ لرسائل الصديقة
  if (msg.role === 'assistant' && (msg.text || msg.html)){
    const tools = document.createElement('div');
    tools.className = 'msg-tools';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.innerHTML = '<i class="far fa-copy"></i> نسخ';

    btn.addEventListener('click', async () => {
      const plain = (msg.text || el.querySelector('.msg-body')?.innerText || '').trim();
      try{
        await navigator.clipboard.writeText(plain);
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = plain;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand('copy'); }catch(_){}
        ta.remove();
      }
      btn.classList.add('done');
      btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
      setTimeout(() => {
        btn.classList.remove('done');
        btn.innerHTML = '<i class="far fa-copy"></i> نسخ';
      }, 1800);
    });

    tools.appendChild(btn);
    el.appendChild(tools);
  }

  return el;
}

function appendMessage(msg, animate = true){
  messagesEl.appendChild(buildMessageElement(msg, animate));
  scrollToBottom();
}

function renderAll(){
  messagesEl.innerHTML = '';
  history.forEach(m => appendMessage(m, false));
  scrollToBottom();
}

/* =========================================================
   10) مؤشر الكتابة ورسائل النظام
   ========================================================= */
function showTyping(label){
  hideTyping();
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML =
    '<span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
    (label ? `<span class="typing-label">${escapeHtml(label)}</span>` : '');
  messagesEl.appendChild(typingEl);
  scrollToBottom();
}

function hideTyping(){
  if (typingEl && typingEl.parentNode) typingEl.remove();
  typingEl = null;
}

function showSystemMessage(text, isError = false){
  const el = document.createElement('div');
  el.className = 'sys-msg' + (isError ? ' err' : '');
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollToBottom();
  setTimeout(() => el.remove(), 4200);
}

/* =========================================================
   11) حالة الإدخال
   ========================================================= */
function setBusy(state){
  busy = state;
  sendButton.disabled  = state;
  imageButton.disabled = state;
  userInput.disabled   = state;
}

/* =========================================================
   12) بناء رسائل الـ API
   ========================================================= */
function buildApiMessages(){
  const out = [{ role: 'system', content: SYSTEM_PROMPT }];

  history.slice(-CONFIG.MAX_HISTORY).forEach(m => {
    let content = '';

    if (m.type === 'image'){
      const note = (m.text || '').trim();
      const ocr  = (m.ocr || '').trim();
      content = note ? note + '\n\n' : '';
      if (ocr){
        content += 'النص المستخرج من الصورة:\n"""\n' + ocr + '\n"""';
      } else {
        content += 'لم يتم استخراج نص واضح من الصورة.';
      }
    } else {
      content = (m.text || '').trim();
    }

    if (!content) return;
    out.push({
      role: m.role === 'assistant' ? 'assistant' : 'user',
      content
    });
  });

  return out;
}

/* =========================================================
   13) الاتصال بـ OpenRouter
   ========================================================= */
async function callAI(){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);

  try{
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Authorization':  'Bearer ' + CONFIG.OPENROUTER_KEY,
        'Content-Type':   'application/json',
        'HTTP-Referer':   location.origin || 'https://localhost',
        'X-Title':        'Doaa Faithful Friend AI'
      },
      body: JSON.stringify({
        model: CONFIG.MODEL,
        messages: buildApiMessages(),
        temperature: 0.8,
        max_tokens: 900
      })
    });

    if (!res.ok){
      const errText = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + (errText ? ' — ' + errText.slice(0, 180) : ''));
    }

    const data = await res.json();
    const text =
      data?.choices?.[0]?.message?.content ??
      data?.choices?.[0]?.text ??
      '';

    if (!text || !text.trim()){
      throw new Error('وصل رد فارغ من الخادم');
    }
    return text.trim();

  }catch(err){
    if (err.name === 'AbortError'){
      throw new Error('تأخّر الرد كثيراً، حاولي مرة أخرى');
    }
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

/* =========================================================
   14) OCR — استخراج النص من الصورة
   ========================================================= */
async function extractTextFromImage(file){
  let worker = null;

  try{
    // المحاولة الأولى: العربية + الإنجليزية
    worker = await Tesseract.createWorker('ara+eng', 1, {
      logger: () => {},
      errorHandler: e => console.warn('[OCR]', e)
    });
  }catch(e){
    console.warn('فشل تحميل اللغة العربية، سيتم استخدام الإنجليزية فقط:', e);
    try{
      if (worker) { await worker.terminate().catch(() => {}); worker = null; }
      worker = await Tesseract.createWorker('eng', 1, { logger: () => {} });
    }catch(e2){
      console.error('فشل إنشاء عامل OCR:', e2);
      return '';
    }
  }

  try{
    const { data } = await worker.recognize(file);
    let text = (data && data.text) ? data.text : '';

    // تنظيف بسيط
    text = text
      .replace(/\r/g, '')
      .replace(/[ \t]+\n/g, '\n')
      .replace(/\n{3,}/g, '\n\n')
      .trim();

    return text;
  }catch(e){
    console.error('فشل التعرف على النص:', e);
    return '';
  }finally{
    if (worker){
      try{ await worker.terminate(); }catch(_){}
    }
  }
}

/* =========================================================
   15) ضغط الصورة
   ========================================================= */
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload  = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

async function compressImage(file){
  try{
    const bitmap = await createImageBitmap(file);
    const maxSide = CONFIG.MAX_IMAGE_SIDE;
    const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width  * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));

    const canvas = document.createElement('canvas');
    canvas.width  = w;
    canvas.height = h;

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bitmap, 0, 0, w, h);

    if (bitmap.close) bitmap.close();

    return canvas.toDataURL('image/jpeg', CONFIG.IMAGE_QUALITY);
  }catch(e){
    console.warn('تعذّر ضغط الصورة، سيتم استخدام الأصل:', e);
    return await fileToDataURL(file);
  }
}

/* =========================================================
   16) إرسال نص
   ========================================================= */
async function sendTextMessage(rawText){
  if (busy) return;

  const text = rawText.trim();
  if (!text) return;

  // أمر المسح
  if (text.toLowerCase() === '/clear'){
    clearChat();
    return;
  }

  setBusy(true);

  const userMsg = { role: 'user', type: 'text', text };
  history.push(userMsg);
  appendMessage(userMsg);
  saveHistory();

  try{
    showTyping('تفكّر…');
    const reply = await callAI();
    hideTyping();

    const aiMsg = { role: 'assistant', type: 'text', text: reply };
    history.push(aiMsg);
    appendMessage(aiMsg);
    saveHistory();

  }catch(err){
    hideTyping();
    console.error(err);
    showSystemMessage('تعذّر الوصول إلى الخادم. تحقّقي من الاتصال وحاولي مجدداً.', true);
  }finally{
    setBusy(false);
    userInput.focus();
  }
}

/* =========================================================
   17) إرسال صورة
   ========================================================= */
async function sendImageMessage(){
  if (busy || !pendingFile || !pendingData) return;

  const file = pendingFile;
  const dataUrl = pendingData;
  const note = previewText.value.trim();

  pendingFile = null;
  pendingData = null;

  closePreview();
  setBusy(true);

  const userMsg = {
    role: 'user',
    type: 'image',
    text: note || 'انظري إلى هذه الصورة',
    image: dataUrl,
    ocr: ''
  };
  history.push(userMsg);
  appendMessage(userMsg);
  saveHistory();

  try{
    // --- استخراج النص ---
    showTyping('أقرأ الصورة…');
    let ocr = '';
    try{
      const ocrPromise = extractTextFromImage(file);
      const timeout = new Promise(r => setTimeout(() => r(''), 90000));
      ocr = await Promise.race([ocrPromise, timeout]);
    }catch(e){
      console.warn('OCR error:', e);
    }
    userMsg.ocr = ocr;
    saveHistory();

    // --- إرسال إلى الذكاء الاصطناعي ---
    showTyping('تفكّر…');
    const reply = await callAI();
    hideTyping();

    const aiMsg = { role: 'assistant', type: 'text', text: reply };
    history.push(aiMsg);
    appendMessage(aiMsg);
    saveHistory();

  }catch(err){
    hideTyping();
    console.error(err);
    showSystemMessage('حدث خطأ أثناء معالجة الصورة. حاولي مرة أخرى.', true);
  }finally{
    setBusy(false);
    userInput.focus();
  }
}

/* =========================================================
   18) مسح المحادثة
   ========================================================= */
function clearChat(){
  history = [greetingMessage()];
  renderAll();
  saveHistory();
  showSystemMessage('تم مسح المحادثة ✨');
}

/* =========================================================
   19) معاينة الصورة
   ========================================================= */
function openPreview(file, dataUrl){
  pendingFile = file;
  pendingData = dataUrl;
  previewImg.src = dataUrl;
  previewText.value = '';
  previewEl.classList.add('open');
  setTimeout(() => previewText.focus(), 120);
}

function closePreview(){
  previewEl.classList.remove('open');
  previewImg.src = '';
  previewText.value = '';
}

function discardPending(){
  pendingFile = null;
  pendingData = null;
  closePreview();
}

/* =========================================================
   20) ربط الأحداث
   ========================================================= */
// --- الدخول ---
function tryAuth(){
  if (passwordInput.value.trim() === CONFIG.PASSWORD){
    try{ sessionStorage.setItem('doaa_auth', '1'); }catch(_){}
    authEl.classList.add('hide');
    setTimeout(() => {
      authEl.style.display = 'none';
      chatEl.classList.add('show');
      startChat();
    }, 350);
  }else{
    authError.classList.add('show');
    passwordInput.value = '';
    passwordInput.focus();
  }
}

authButton.addEventListener('click', tryAuth);
passwordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); tryAuth(); }
});
passwordInput.addEventListener('input', () => authError.classList.remove('show'));

// --- بدء المحادثة ---
function startChat(){
  if (history.length === 0){
    const saved = loadHistory();
    history = saved && saved.length ? saved : [greetingMessage()];
  }
  renderAll();
  userInput.focus();
}

// --- إرسال ---
composerEl.addEventListener('submit', e => {
  e.preventDefault();
  const text = userInput.value;
  userInput.value = '';
  autoGrow();
  sendTextMessage(text);
});

// Enter للإرسال / Shift+Enter لسطر جديد
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    composerEl.requestSubmit();
  }
});

userInput.addEventListener('input', autoGrow);

// --- زر الصورة ---
imageButton.addEventListener('click', () => {
  if (!busy) imageInput.click();
});

imageInput.addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  imageInput.value = '';
  if (!file) return;

  if (!file.type.startsWith('image/')){
    showSystemMessage('الملف المختار ليس صورة', true);
    return;
  }

  try{
    const dataUrl = await compressImage(file);
    openPreview(file, dataUrl);
  }catch(err){
    console.error(err);
    showSystemMessage('تعذّر تحميل الصورة', true);
  }
});

// --- أزرار المعاينة ---
previewCancel.addEventListener('click', discardPending);
previewRemove.addEventListener('click', discardPending);
previewConfirm.addEventListener('click', sendImageMessage);

previewEl.addEventListener('click', e => {
  if (e.target === previewEl) discardPending();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && previewEl.classList.contains('open')){
    discardPending();
  }
});

// --- منع اختفاء الرسائل عند تغيّر حجم الشاشة ---
window.addEventListener('resize', () => {
  autoGrow();
  scrollToBottom();
});

/* =========================================================
   21) التهيئة
   ========================================================= */
(function init(){
  // إذا سبق الدخول في هذه الجلسة
  let already = false;
  try{ already = sessionStorage.getItem('doaa_auth') === '1'; }catch(_){}

  if (already){
    authEl.style.display = 'none';
    chatEl.classList.add('show');
    startChat();
  }else{
    setTimeout(() => passwordInput.focus(), 250);
  }
})();
</script>
