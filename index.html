<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #FFFFFF;
            --secondary-bg: #F8F9FA;
            --accent-pink: #FF005B;
            --light-pink: #FF2EE4;
            --gradient-pink: linear-gradient(135deg, #FF005B, #FF2EE4);
            --text-primary: #333333;
            --text-secondary: #6C757D;
            --chat-bubble-ai: #FFFFFF;
            --chat-bubble-user: #FF005B;
            --success-green: #28A745;
            --error-red: #DC3545;
            --border-color: #E9ECEF;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            direction: rtl;
            text-align: right;
            overflow: hidden;
        }

        /* شاشة التحقق بكلمة المرور */
        .auth-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF005B, #FF2EE4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .auth-box {
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .auth-logo {
            font-size: 2.5rem;
            color: var(--accent-pink);
            margin-bottom: 1rem;
        }

        .auth-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 3px rgba(255, 0, 91, 0.1);
        }

        .auth-button {
            width: 100%;
            padding: 0.9rem;
            background: var(--gradient-pink);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 0, 91, 0.3);
        }

        .auth-error {
            color: var(--error-red);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        /* التصميم الرئيسي */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow);
            background-color: var(--primary-bg);
            border-radius: var(--radius);
            margin-top: 10px;
            margin-bottom: 10px;
            height: calc(100vh - 20px);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: var(--gradient-pink);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
      
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .chat-icon {
            font-size: 1.5rem;
        }

        .clear-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-pink) var(--secondary-bg);
            background-color: var(--secondary-bg);
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--secondary-bg);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background-color: var(--accent-pink);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
            font-size: 1rem;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--chat-bubble-ai);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 0.25rem;
        }

        .user-message {
            align-self: flex-end;
            background: var(--gradient-pink);
            color: white;
            border-bottom-left-radius: 0.25rem;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            justify-content: flex-end;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 6px;
            padding: 0.35rem 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
        }

        .action-btn i {
            font-size: 0.9rem;
        }

        .input-container {
            padding: 1.2rem 1.5rem;
            background-color: var(--primary-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            position: relative;
        }

        #user-input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background-color: var(--primary-bg);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
            font-size: 1rem;
            min-height: 50px;
            max-height: 120px;
            resize: none;
            line-height: 1.5;
            overflow-y: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }

        #user-input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 3px rgba(255, 0, 91, 0.1);
        }

        #send-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-pink);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(255, 0, 91, 0.2);
        }

        #send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 0, 91, 0.3);
        }

        #send-button:active {
            transform: scale(0.95);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--chat-bubble-ai);
            padding: 0.75rem 1.2rem;
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .typing-dots {
            display: flex;
            gap: 0.5rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--light-pink);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .bold-text {
            font-weight: 700;
        }

        .address-text {
            color: var(--accent-pink);
            font-weight: 600;
        }

        .code-block {
            background-color: #1e1e2d;
            border-radius: 10px;
            padding: 0;
            margin: 1rem 0;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 91, 0.2);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1rem;
            background-color: #252538;
            color: #9cdcfe;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        .copy-btn {
            background: rgba(255, 0, 91, 0.15);
            color: #9cdcfe;
            border: none;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 0, 91, 0.3);
        }

        .copy-btn i {
            font-size: 0.8rem;
        }

        .code-content {
            font-family: 'Fira Code', monospace;
            white-space: pre;
            overflow-x: auto;
            margin: 0;
            padding: 1rem;
            background-color: #1e1e2d;
            color: #d4d4d4;
            line-height: 1.5;
            tab-size: 4;
        }

        .code-keyword { color: #569cd6; }
        .code-string { color: #ce9178; }
        .code-comment { color: #6a9955; }
        .code-number { color: #b5cea8; }
        .code-function { color: #dcdcaa; }
        .code-operator { color: #d4d4d4; }
        .code-type { color: #4ec9b0; }

        .image-placeholder {
            max-width: 100%;
            border-radius: 10px;
            margin: 0.5rem 0;
            background-color: #252538;
            padding: 1.5rem;
            text-align: center;
            border: 1px dashed rgba(255, 0, 91, 0.3);
            color: var(--text-secondary);
        }

        .image-placeholder i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-pink);
        }

        .status-message {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0.5rem 0;
        }

        .success-message {
            color: var(--success-green);
        }

        .error-message {
            color: var(--error-red);
        }

        /* تحسينات للشاشات الصغيرة */
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
            
            .chat-header {
                padding: 0.9rem 1.2rem;
            }
            
            .chat-messages {
                padding: 1rem;
            }

            .message {
                max-width: 90%;
                padding: 0.8rem 1rem;
                font-size: 0.95rem;
            }

            .input-container {
                padding: 1rem;
            }

            #send-button {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }

            .action-btn {
                padding: 0.3rem 0.6rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .chat-messages {
                padding: 0.75rem;
            }

            .message {
                white-space: pre-wrap;
                word-wrap: break-word;
                max-width: 95%;
            }

            .message-actions {
                gap: 0.3rem;
            }

            .action-btn {
                padding: 0.25rem 0.5rem;
                font-size: 0.75rem;
            }

            .code-header {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .code-content {
                padding: 0.8rem;
                font-size: 0.85rem;
            }
            
            .auth-box {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- شاشة التحقق بكلمة المرور -->
    <div class="auth-container" id="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <i class="fas fa-robot"></i>
            </div>
            <h1 class="auth-title">Alpha AI</h1>
            <p class="auth-subtitle">مساعدك الذكي الخاص - يرجى إدخال كلمة المرور للوصول</p>
            <input type="password" class="auth-input" id="password-input" placeholder="كلمة المرور">
            <button class="auth-button" id="auth-button">دخول</button>
            <div class="auth-error" id="auth-error">كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى</div>
        </div>
    </div>

    <!-- تطبيق الدردشة -->
    <div class="chat-container" id="chat-container" style="display: none;">
        <div class="chat-header">
            <div class="chat-title">
                <i class="fas fa-robot chat-icon"></i>
                <span>Alpha AI - مساعدك الذكي</span>
            </div>
            <button class="clear-btn" id="clear-button">
                <i class="fas fa-trash-alt"></i>
                مسح المحادثة
            </button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- سيتم تحميل الرسائل هنا بعد التحقق -->
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="إسأل Alpha AI أي شيئ..." autocomplete="off" rows="1"></textarea>
                <button id="send-button" title="إرسال الرسالة">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // الثوابت والمتغيرات العامة
        const API_KEY = 'AIzaSyA-DwiqeepDktOiHt2jY85e4Fn_WEu-8qA';
        const PASSWORD = 'dolo2007';
        
        // العناصر الرئيسية
        const authContainer = document.getElementById('auth-container');
        const chatContainer = document.getElementById('chat-container');
        const passwordInput = document.getElementById('password-input');
        const authButton = document.getElementById('auth-button');
        const authError = document.getElementById('auth-error');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const clearButton = document.getElementById('clear-button');
        const typingIndicator = document.getElementById('typing-indicator');

        // التحقق من كلمة المرور
        authButton.addEventListener('click', authenticate);
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                authenticate();
            }
        });

        function authenticate() {
            const enteredPassword = passwordInput.value.trim();
            
            if (enteredPassword === PASSWORD) {
                // كلمة المرور صحيحة
                authContainer.style.opacity = '0';
                setTimeout(() => {
                    authContainer.style.display = 'none';
                    chatContainer.style.display = 'flex';
                    initializeChat();
                }, 500);
            } else {
                // كلمة المرور خاطئة
                authError.style.display = 'block';
                passwordInput.style.borderColor = 'var(--error-red)';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // تهيئة المحادثة
        function initializeChat() {
            // تهيئة تاريخ المحادثة من localStorage أو إنشاء جديد
            let conversationHistory = JSON.parse(localStorage.getItem('alphaAI_chatHistory')) || [
                {
                    content: "مرحباً، أنا Alpha AI مساعدك الخاص المطور من طرف مخابر B.Y PRO المعروفة باسم Fluxa AI lab.\n\nلمسح المحادثة، اضغط على زر 'مسح المحادثة' في الأعلى أو ارسل لي الأمر <strong>/clear</strong>. إذن كيف اساعدك اليوم؟ 😊",
                    role: 'assistant',
                    type: 'text',
                    timestamp: new Date().toISOString()
                }
            ];

            // عرض المحادثة
            renderConversation(conversationHistory);
            
            // ضبط المستمعين للأحداث
            setupEventListeners(conversationHistory);
            
            // التركيز على حقل الإدخال
            userInput.focus();
        }

        // ضبط المستمعين للأحداث
        function setupEventListeners(conversationHistory) {
            // إرسال الرسالة
            sendButton.addEventListener('click', async () => {
                await sendMessage(conversationHistory);
            });

            // إرسال بالضغط على Enter
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendButton.click();
                }
            });

            // مسح المحادثة
            clearButton.addEventListener('click', () => {
                clearChat(conversationHistory);
            });

            // تعديل حجم حقل الإدخال تلقائياً
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }

        // إرسال رسالة
        async function sendMessage(conversationHistory) {
            const message = userInput.value.trim();
            if (message) {
                addMessage(message, true, conversationHistory);
                userInput.value = '';
                userInput.style.height = 'auto';
                
                if (message.toLowerCase() !== '/clear') {
                    const response = await sendToAPI(message, conversationHistory);
                    addMessage(response, false, conversationHistory);
                }
            }
        }

        // عرض المحادثة
        function renderConversation(conversationHistory) {
            chatMessages.innerHTML = '';
            conversationHistory.forEach(msg => {
                addMessage(msg.content, msg.role === 'user', conversationHistory, false);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // حفظ المحادثة
        function saveConversation(conversationHistory) {
            localStorage.setItem('alphaAI_chatHistory', JSON.stringify(conversationHistory));
        }

        // مسح المحادثة
        function clearChat(conversationHistory) {
            conversationHistory.length = 0;
            conversationHistory.push({
                content: "تم مسح المحادثة، كيف يمكنني مساعدتك اليوم؟ 😊",
                role: 'assistant',
                type: 'text',
                timestamp: new Date().toISOString()
            });
            saveConversation(conversationHistory);
            renderConversation(conversationHistory);
        }

        // إضافة رسالة جديدة
        function addMessage(content, isUser, conversationHistory, saveToHistory = true) {
            if (content.trim().toLowerCase() === '/clear') {
                clearChat(conversationHistory);
                return;
            }

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(isUser ? 'user-message' : 'ai-message');

            if (!isUser) {
                // معالجة ردود الذكاء الاصطناعي للتنسيق الغني
                const parts = content.split(/(```[\s\S]*?```|\[IMAGE\][\s\S]*?\[\/IMAGE\]|\*\*.*?\*\*|\[ADDRESS\].*?\[\/ADDRESS\])/);

                parts.forEach(part => {
                    if (!part || part.trim() === '') return;

                    if (part.startsWith('```') && part.endsWith('```')) {
                        // كتل الكود
                        const langMatch = part.match(/^```(\w+)/);
                        const language = langMatch ? langMatch[1] : '';
                        const codeContent = part.replace(/^```[\w]*\n/, '').replace(/```$/, '');
                        messageDiv.appendChild(createCodeBlock(codeContent, language));
                    } 
                    else if (part.startsWith('[IMAGE]') && part.endsWith('[/IMAGE]')) {
                        // عنصر نائب للصورة
                        const imageDesc = part.replace('[IMAGE]', '').replace('[/IMAGE]', '');
                        messageDiv.appendChild(createImagePlaceholder(imageDesc));
                    }
                    else if (part.startsWith('**') && part.endsWith('**')) {
                        // نص عريض
                        const boldText = document.createElement('span');
                        boldText.className = 'bold-text';
                        boldText.textContent = part.slice(2, -2);
                        messageDiv.appendChild(boldText);
                    }
                    else if (part.startsWith('[ADDRESS]') && part.endsWith('[/ADDRESS]')) {
                        // نص العنوان
                        const addressText = document.createElement('span');
                        addressText.className = 'address-text';
                        addressText.textContent = part.replace('[ADDRESS]', '').replace('[/ADDRESS]', '');
                        messageDiv.appendChild(addressText);
                    }
                    else {
                        // نص عادي مع فواصل الأسطر
                        const textPart = document.createElement('span');
                        textPart.innerHTML = part.replace(/\n/g, '<br>');
                        messageDiv.appendChild(textPart);
                    }
                });

                // إضافة أزرار الإجراءات لرسائل الذكاء الاصطناعي
                if (saveToHistory) {
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'message-actions';
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'action-btn copy-response-btn';
                    copyBtn.innerHTML = '<i class="far fa-copy"></i> نسخ';
                    copyBtn.addEventListener('click', () => {
                        navigator.clipboard.writeText(content);
                        showStatusMessage('تم النسخ إلى الحافظة!', 'success');
                        copyBtn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
                        setTimeout(() => {
                            copyBtn.innerHTML = '<i class="far fa-copy"></i> نسخ';
                        }, 2000);
                    });
                    
                    actionsDiv.appendChild(copyBtn);
                    messageDiv.appendChild(actionsDiv);
                }
            } 
            else {
                // رسائل المستخدم (نص عادي)
                messageDiv.textContent = content;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // الحفظ في تاريخ المحادثة إذا لزم الأمر
            if (saveToHistory) {
                conversationHistory.push({
                    content: content,
                    role: isUser ? 'user' : 'assistant',
                    type: 'text',
                    timestamp: new Date().toISOString()
                });
                saveConversation(conversationHistory);
            }
        }

        // إنشاء كتلة كود
        function createCodeBlock(content, language = '') {
            const codeBlock = document.createElement('div');
            codeBlock.className = 'code-block';
            
            const header = document.createElement('div');
            header.className = 'code-header';
            
            const langSpan = document.createElement('span');
            langSpan.textContent = language || 'كود';
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="far fa-copy"></i> نسخ';
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(content);
                showStatusMessage('تم نسخ الكود!', 'success');
                copyBtn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="far fa-copy"></i> نسخ';
                }, 2000);
            });
            
            header.appendChild(langSpan);
            header.appendChild(copyBtn);
            
            const codeContent = document.createElement('pre');
            codeContent.className = 'code-content';
            codeContent.innerHTML = highlightSyntax(content, language);
            
            codeBlock.appendChild(header);
            codeBlock.appendChild(codeContent);
            
            return codeBlock;
        }

        // تمييز الصيغة
        function highlightSyntax(code, language = '') {
            // تهريب الأحرف الخاصة في HTML
            let escapedCode = code
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\t/g, "    ");

            // الأنماط الشائعة عبر اللغات
            escapedCode = escapedCode
                .replace(/\b(function|if|else|for|while|return|let|const|var|class|import|from|def|try|except|async|await|export|switch|case|default|break|continue)\b/g, 
                        '<span class="code-keyword">$&</span>')
                .replace(/\b(console\.log|print|document\.\w+|window\.\w+)\b/g, 
                        '<span class="code-function">$&</span>')
                .replace(/(".*?"|'.*?'|`.*?`)/g, 
                        '<span class="code-string">$&</span>')
                .replace(/\/\/.*?$|\/\*[\s\S]*?\*\/|#.*$/gm, 
                        '<span class="code-comment">$&</span>')
                .replace(/\b(\d+\.?\d*)\b/g, 
                        '<span class="code-number">$&</span>')
                .replace(/(==|===|!=|!==|=|\+|-|\*|\/|%|&&|\|\||!|\(|\)|{|}|\[|\]|;|,|\.|:|=>|->|\|\>|&lt;|&gt;)/g, 
                        '<span class="code-operator">$&</span>');

            // الأنماط الخاصة باللغة
            if (language === 'python') {
                escapedCode = escapedCode
                    .replace(/\b(True|False|None|and|or|not|def|class|lambda|with|as|from|import|try|except|finally|raise)\b/g,
                            '<span class="code-keyword">$&</span>');
            } else if (language === 'javascript' || language === 'js') {
                escapedCode = escapedCode
                    .replace(/\b(const|let|var|function|this|new|typeof|instanceof|in|of|extends|super)\b/g,
                            '<span class="code-keyword">$&</span>')
                    .replace(/\b(Array|String|Number|Object|Boolean|Date|Math|JSON|Promise|Symbol|Set|Map)\b/g,
                            '<span class="code-type">$&</span>');
            }

            return escapedCode;
        }

        // إنشاء عنصر نائب للصورة
        function createImagePlaceholder(description) {
            const placeholder = document.createElement('div');
            placeholder.className = 'image-placeholder';
            
            const icon = document.createElement('i');
            icon.className = 'fas fa-image';
            
            const desc = document.createElement('div');
            desc.textContent = description || 'وصف الصورة';
            
            placeholder.appendChild(icon);
            placeholder.appendChild(desc);
            
            return placeholder;
        }

        // عرض رسالة الحالة
        function showStatusMessage(message, type = 'info') {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status-message ${type}-message`;
            statusDiv.textContent = message;
            
            chatMessages.appendChild(statusDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            setTimeout(() => {
                statusDiv.remove();
            }, 3000);
        }

        // عرض مؤشر الكتابة
        function showTypingIndicator() {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // إخفاء مؤشر الكتابة
        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }

        // إرسال رسالة إلى Gemini API - الإصاح المهم هنا
        async function sendToAPI(message, conversationHistory) {
            showTypingIndicator();
            
            try {
                // بناء المحادثة بشكل مبسط ومناسب للنموذج
                const conversationContext = conversationHistory
                    .slice(-6) // استخدام آخر 6 رسائل فقط للسياق
                    .map(msg => `${msg.role === 'user' ? 'المستخدم' : 'المساعد'}: ${msg.content.replace(/<[^>]*>/g, '')}`)
                    .join('\n');
                
                const prompt = `أنت Alpha AI، مساعد ذكي متطور من قبل Fluxa AI Lab (قسم الذكاء الاصطناعي في B.Y PRO). أنت مخصص لمساعدة المستخدمين في مختلف المجالات.

السياق السابق:
${conversationContext}

يرجى الرد على سؤال المستخدم التالي بطريقة مفيدة ومفصلة:
${message}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            topK: 40,
                            topP: 0.95,
                            maxOutputTokens: 1000,
                        }
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', errorText);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                hideTypingIndicator();
                
                if (data.candidates && 
                    data.candidates[0] && 
                    data.candidates[0].content && 
                    data.candidates[0].content.parts && 
                    data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    console.error('Unexpected API response structure:', data);
                    return "عذرًا، لم أتمكن من معالجة طلبك. يرجى المحاولة مرة أخرى.";
                }
            } catch (error) {
                hideTypingIndicator();
                console.error('Error calling Gemini API:', error);
                return "حدث خطأ في الاتصال. يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى. إذا استمرت المشكلة، قد يكون هناك مشكلة في مفتاح API.";
            }
        }
    </script>
